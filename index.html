<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#11151d" />
    <!-- Added to the home screen: no browser bars (an iPhone has no element fullscreen); the status bar over the game (safe areas). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Turbogol</title>
    <meta name="description" content="Turbogol: fast car soccer in the browser. Rigid-body physics in WebAssembly, a WebGPU renderer and procedural everything, with bots, training and online play." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="canonical" href="https://turbo-gol.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Turbogol" />
    <meta property="og:title" content="Turbogol" />
    <meta property="og:description" content="Fast physics car soccer in the browser: bots, training and online play. Free and open source." />
    <meta property="og:url" content="https://turbo-gol.com/" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="hud"></div>
      <!-- The loading screen from the first paint (src/ui/LoadingOverlay.ts takes it over). -->
      <div id="overlay" class="ld ld-on" aria-busy="true">
        <div class="ld-box">
          <div class="ld-logo" aria-hidden="true"><span class="ld-logo-a">TURBO</span><span class="ld-logo-b">GOL</span></div>
          <div class="ld-bar"><div class="ld-fill ld-creep"></div></div>
          <div class="ld-line"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
