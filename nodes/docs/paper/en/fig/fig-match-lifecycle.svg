<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="936" viewBox="0 0 760 936" font-family="'Segoe UI', Arial, sans-serif" font-size="12">
  <title>Life cycle of a ranked match on a node</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f0e"/></marker>
  </defs>

  <rect x="0" y="0" width="760" height="936" fill="#ffffff"/>

  <!-- Lifelines -->
  <g stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4">
    <line x1="64" y1="58" x2="64" y2="916"/>
    <line x1="190" y1="58" x2="190" y2="916"/>
    <line x1="316" y1="58" x2="316" y2="916"/>
    <line x1="442" y1="58" x2="442" y2="916"/>
    <line x1="568" y1="58" x2="568" y2="916"/>
    <line x1="694" y1="58" x2="694" y2="916"/>
  </g>

  <!-- Lane headers -->
  <rect x="5" y="12" width="118" height="46" rx="8" fill="#ffffff" stroke="#1d2433" stroke-width="1.5"/>
  <text x="64" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2433">Players</text>
  <text x="64" y="49" text-anchor="middle" fill="#6b7280">browsers</text>

  <rect x="131" y="12" width="118" height="46" rx="8" fill="#ffffff" stroke="#1d2433" stroke-width="1.5"/>
  <text x="190" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2433">Matchmaker</text>
  <text x="190" y="49" text-anchor="middle" fill="#6b7280">regional</text>

  <rect x="257" y="12" width="118" height="46" rx="8" fill="#ffffff" stroke="#1d2433" stroke-width="2"/>
  <text x="316" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2433">Control plane</text>
  <text x="316" y="49" text-anchor="middle" fill="#6b7280">node registry</text>

  <rect x="383" y="12" width="118" height="46" rx="8" fill="#fdf4e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="442" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2433">Host node</text>
  <text x="442" y="49" text-anchor="middle" fill="#6b7280">run by an operator</text>

  <rect x="509" y="12" width="118" height="46" rx="8" fill="#f2f5ee" stroke="#2f6f0e" stroke-width="1.5"/>
  <text x="568" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2433">Verifier</text>
  <text x="568" y="49" text-anchor="middle" fill="#6b7280">project node</text>

  <rect x="635" y="12" width="118" height="46" rx="8" fill="#ffffff" stroke="#1d2433" stroke-width="1.5"/>
  <text x="694" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2433">Accounts</text>
  <text x="694" y="49" text-anchor="middle" fill="#6b7280">ratings</text>

  <!-- Phases -->
  <g fill="none" stroke="#6b7280" stroke-width="1.2">
    <path d="M40,80 H34 V272 H40"/>
    <path d="M40,282 H34 V400 H40"/>
    <path d="M40,406 H34 V572 H40"/>
    <path d="M40,580 H34 V840 H40"/>
    <path d="M40,848 H34 V908 H40"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#6b7280">
    <text transform="translate(26,176) rotate(-90)">Placement</text>
    <text transform="translate(26,341) rotate(-90)">Match</text>
    <text transform="translate(26,489) rotate(-90)">Report and draw</text>
    <text transform="translate(26,710) rotate(-90)">Verification</text>
    <text transform="translate(26,878) rotate(-90)">Outcome</text>
  </g>

  <!-- 1. Placement request -->
  <line x1="190" y1="96" x2="316" y2="96" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="253" y="89" text-anchor="middle" fill="#1d2433">requests placement</text>

  <!-- 2. Assignment -->
  <line x1="316" y1="134" x2="442" y2="134" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="379" y="127" text-anchor="middle" fill="#1d2433">assign</text>

  <!-- 3. Acceptance -->
  <line x1="442" y1="170" x2="316" y2="170" stroke="#1d2433" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="379" y="163" text-anchor="middle" fill="#1d2433">accepts + wss URL</text>

  <!-- 4. Tickets -->
  <line x1="316" y1="222" x2="190" y2="222" stroke="#1d2433" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="253" y="201" text-anchor="middle" fill="#1d2433">node + signed</text>
  <text x="253" y="215" text-anchor="middle" fill="#1d2433">tickets (90 s)</text>

  <!-- 5. Reply to the players -->
  <line x1="190" y1="262" x2="64" y2="262" stroke="#1d2433" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  <text x="127" y="255" text-anchor="middle" fill="#1d2433">URL + ticket</text>

  <!-- 6. Direct connection -->
  <line x1="64" y1="314" x2="442" y2="314" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="127" y="293" text-anchor="middle" fill="#1d2433">connects over wss,</text>
  <text x="127" y="307" text-anchor="middle" fill="#1d2433">directly to the node</text>

  <!-- Note: match -->
  <rect x="342" y="322" width="200" height="74" rx="8" fill="#fdf4e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="442" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2433">Match at 120 Hz</text>
  <text x="442" y="356" text-anchor="middle" fill="#1d2433">records the applied inputs,</text>
  <text x="442" y="372" text-anchor="middle" fill="#1d2433">a hash every 120 ticks,</text>
  <text x="442" y="388" text-anchor="middle" fill="#1d2433">and the end record</text>

  <!-- 7. Replay, uploaded with a signed request -->
  <line x1="442" y1="432" x2="316" y2="432" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="379" y="411" text-anchor="middle" fill="#1d2433">replay (signed</text>
  <text x="379" y="425" text-anchor="middle" fill="#1d2433">request + SHA-256)</text>

  <!-- 8. Report -->
  <line x1="442" y1="468" x2="316" y2="468" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="379" y="461" text-anchor="middle" fill="#1d2433">end report</text>

  <!-- Note: draw -->
  <rect x="194" y="482" width="244" height="88" rx="8" fill="#ffffff" stroke="#1d2433" stroke-width="1.5"/>
  <text x="316" y="499" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2433">Verification draw</text>
  <text x="316" y="515" text-anchor="middle" fill="#1d2433">ranked or node on probation: p = 1</text>
  <text x="316" y="530" text-anchor="middle" fill="#1d2433">casual, active community node: p = 0.2</text>
  <text x="316" y="545" text-anchor="middle" fill="#1d2433">casual, project node: p = 0</text>
  <text x="316" y="561" text-anchor="middle" fill="#6b7280">not sampled: no points</text>

  <!-- 9. Verification job -->
  <line x1="316" y1="604" x2="568" y2="604" stroke="#2f6f0e" stroke-width="1.5" marker-end="url(#ahg)"/>
  <text x="379" y="583" text-anchor="middle" fill="#1d2433">verification</text>
  <text x="379" y="597" text-anchor="middle" fill="#1d2433">job</text>

  <!-- Note: re-simulation -->
  <rect x="458" y="618" width="220" height="98" rx="8" fill="#f2f5ee" stroke="#2f6f0e" stroke-width="1.5"/>
  <text x="568" y="637" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2433">Re-simulation</text>
  <text x="568" y="653" text-anchor="middle" fill="#1d2433">downloads the replay (signed</text>
  <text x="568" y="669" text-anchor="middle" fill="#1d2433">request) and checks its SHA-256;</text>
  <text x="568" y="685" text-anchor="middle" fill="#1d2433">re-simulates from tick 1;</text>
  <text x="568" y="701" text-anchor="middle" fill="#1d2433">compares hashes, score, and ending</text>

  <!-- 10. Verdict -->
  <line x1="568" y1="740" x2="316" y2="740" stroke="#2f6f0e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ahg)"/>
  <text x="505" y="733" text-anchor="middle" fill="#1d2433">verdict</text>

  <!-- Note: apply the verdict -->
  <rect x="208" y="756" width="216" height="80" rx="8" fill="#ffffff" stroke="#1d2433" stroke-width="1.5"/>
  <text x="316" y="775" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2433">Apply the verdict</text>
  <text x="316" y="792" text-anchor="middle" fill="#1d2433">compares with the report</text>
  <text x="316" y="809" text-anchor="middle" fill="#1d2433">and its own clock;</text>
  <text x="316" y="826" text-anchor="middle" fill="#6b7280">the outcome comes from the verdict</text>

  <!-- 11. Outcome to accounts -->
  <line x1="316" y1="866" x2="694" y2="866" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="505" y="845" text-anchor="middle" fill="#1d2433">ratings and</text>
  <text x="505" y="859" text-anchor="middle" fill="#1d2433">abandon penalties</text>

  <!-- 12. Release locks -->
  <line x1="316" y1="900" x2="190" y2="900" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="253" y="893" text-anchor="middle" fill="#1d2433">release locks</text>
</svg>
