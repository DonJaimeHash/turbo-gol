<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" font-family="'Segoe UI', Arial, sans-serif" font-size="12">
  <title>Probabilidad de no detectar a un anfitrión que falsifica k partidas</title>
  <!-- Escala: x = 90 + 21·k ; y = 50 + 110·(−log10 P). Curvas: P = (1 − p)^k para p = 0.1, 0.2 y 0.5; p = 1 y p = 0 son casos límite. -->

  <rect x="0" y="0" width="760" height="600" fill="#ffffff"/>

  <!-- Título interno con la fórmula -->
  <text x="90" y="30" font-size="14" fill="#1d2433">P(no detectado tras k partidas falsificadas) = (1 − p)<tspan dy="-6" font-size="12" fill="#1d2433">k</tspan></text>

  <!-- Cuadrícula -->
  <g stroke="#6b7280" stroke-width="1" stroke-opacity="0.3">
    <line x1="90" y1="50" x2="720" y2="50"/>
    <line x1="90" y1="160" x2="720" y2="160"/>
    <line x1="90" y1="270" x2="720" y2="270"/>
    <line x1="90" y1="380" x2="720" y2="380"/>
    <line x1="90" y1="402" x2="720" y2="402"/>
  </g>
  <g stroke="#6b7280" stroke-width="1" stroke-opacity="0.18">
    <line x1="195" y1="50" x2="195" y2="414"/>
    <line x1="300" y1="50" x2="300" y2="414"/>
    <line x1="405" y1="50" x2="405" y2="414"/>
    <line x1="510" y1="50" x2="510" y2="414"/>
    <line x1="615" y1="50" x2="615" y2="414"/>
    <line x1="720" y1="50" x2="720" y2="414"/>
  </g>

  <!-- Ejes -->
  <g stroke="#1d2433" stroke-width="1.5" fill="none">
    <line x1="90" y1="50" x2="90" y2="386"/>
    <line x1="90" y1="396" x2="90" y2="414"/>
    <line x1="90" y1="414" x2="720" y2="414"/>
    <line x1="84" y1="390" x2="96" y2="384"/>
    <line x1="84" y1="396" x2="96" y2="390"/>
  </g>

  <!-- Marcas mayores del eje y -->
  <g stroke="#1d2433" stroke-width="1.5">
    <line x1="84" y1="50" x2="90" y2="50"/>
    <line x1="84" y1="160" x2="90" y2="160"/>
    <line x1="84" y1="270" x2="90" y2="270"/>
    <line x1="84" y1="380" x2="90" y2="380"/>
    <line x1="84" y1="402" x2="90" y2="402"/>
  </g>
  <!-- Marcas menores (2 a 9 por década) -->
  <g stroke="#1d2433" stroke-width="1">
    <line x1="87" y1="55.03" x2="90" y2="55.03"/><line x1="87" y1="60.66" x2="90" y2="60.66"/><line x1="87" y1="67.04" x2="90" y2="67.04"/><line x1="87" y1="74.40" x2="90" y2="74.40"/>
    <line x1="87" y1="83.11" x2="90" y2="83.11"/><line x1="87" y1="93.77" x2="90" y2="93.77"/><line x1="87" y1="107.52" x2="90" y2="107.52"/><line x1="87" y1="126.89" x2="90" y2="126.89"/>
    <line x1="87" y1="165.03" x2="90" y2="165.03"/><line x1="87" y1="170.66" x2="90" y2="170.66"/><line x1="87" y1="177.04" x2="90" y2="177.04"/><line x1="87" y1="184.40" x2="90" y2="184.40"/>
    <line x1="87" y1="193.11" x2="90" y2="193.11"/><line x1="87" y1="203.77" x2="90" y2="203.77"/><line x1="87" y1="217.52" x2="90" y2="217.52"/><line x1="87" y1="236.89" x2="90" y2="236.89"/>
    <line x1="87" y1="275.03" x2="90" y2="275.03"/><line x1="87" y1="280.66" x2="90" y2="280.66"/><line x1="87" y1="287.04" x2="90" y2="287.04"/><line x1="87" y1="294.40" x2="90" y2="294.40"/>
    <line x1="87" y1="303.11" x2="90" y2="303.11"/><line x1="87" y1="313.77" x2="90" y2="313.77"/><line x1="87" y1="327.52" x2="90" y2="327.52"/><line x1="87" y1="346.89" x2="90" y2="346.89"/>
  </g>
  <g text-anchor="end" fill="#1d2433">
    <text x="81" y="54">1</text>
    <text x="81" y="164">0.1</text>
    <text x="81" y="274">0.01</text>
    <text x="81" y="384">0.001</text>
    <text x="81" y="406">0</text>
  </g>

  <!-- Marcas del eje x -->
  <g stroke="#1d2433" stroke-width="1">
    <line x1="111" y1="414" x2="111" y2="417"/><line x1="132" y1="414" x2="132" y2="417"/><line x1="153" y1="414" x2="153" y2="417"/><line x1="174" y1="414" x2="174" y2="417"/>
    <line x1="216" y1="414" x2="216" y2="417"/><line x1="237" y1="414" x2="237" y2="417"/><line x1="258" y1="414" x2="258" y2="417"/><line x1="279" y1="414" x2="279" y2="417"/>
    <line x1="321" y1="414" x2="321" y2="417"/><line x1="342" y1="414" x2="342" y2="417"/><line x1="363" y1="414" x2="363" y2="417"/><line x1="384" y1="414" x2="384" y2="417"/>
    <line x1="426" y1="414" x2="426" y2="417"/><line x1="447" y1="414" x2="447" y2="417"/><line x1="468" y1="414" x2="468" y2="417"/><line x1="489" y1="414" x2="489" y2="417"/>
    <line x1="531" y1="414" x2="531" y2="417"/><line x1="552" y1="414" x2="552" y2="417"/><line x1="573" y1="414" x2="573" y2="417"/><line x1="594" y1="414" x2="594" y2="417"/>
    <line x1="636" y1="414" x2="636" y2="417"/><line x1="657" y1="414" x2="657" y2="417"/><line x1="678" y1="414" x2="678" y2="417"/><line x1="699" y1="414" x2="699" y2="417"/>
  </g>
  <g stroke="#1d2433" stroke-width="1.5">
    <line x1="90" y1="414" x2="90" y2="420"/><line x1="195" y1="414" x2="195" y2="420"/><line x1="300" y1="414" x2="300" y2="420"/>
    <line x1="405" y1="414" x2="405" y2="420"/><line x1="510" y1="414" x2="510" y2="420"/><line x1="615" y1="414" x2="615" y2="420"/><line x1="720" y1="414" x2="720" y2="420"/>
  </g>
  <g text-anchor="middle" fill="#1d2433">
    <text x="90" y="434">0</text>
    <text x="195" y="434">5</text>
    <text x="300" y="434">10</text>
    <text x="405" y="434">15</text>
    <text x="510" y="434">20</text>
    <text x="615" y="434">25</text>
    <text x="720" y="434">30</text>
  </g>

  <!-- Títulos de ejes -->
  <text x="405" y="460" text-anchor="middle" fill="#1d2433">k = número de partidas falsificadas por el mismo anfitrión</text>
  <text transform="translate(34,226) rotate(-90)" text-anchor="middle" fill="#1d2433">probabilidad de no ser detectado (escala logarítmica)</text>

  <!-- Umbrales de 95 % y 99 % de detección -->
  <g stroke="#1d2433" stroke-width="1" stroke-dasharray="5 4">
    <line x1="90" y1="193.11" x2="720" y2="193.11"/>
    <line x1="90" y1="270" x2="720" y2="270"/>
  </g>

  <!-- p = 0: nunca se verifica (línea en P = 1) -->
  <line x1="90" y1="50" x2="720" y2="50" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- p = 1: P = 0 desde k = 1 -->
  <polyline points="90,50 111,402 720,402" fill="none" stroke="#2f6f0e" stroke-width="2"/>
  <g fill="#2f6f0e">
    <circle cx="111" cy="402" r="2.5"/><circle cx="132" cy="402" r="2.5"/><circle cx="153" cy="402" r="2.5"/><circle cx="174" cy="402" r="2.5"/><circle cx="195" cy="402" r="2.5"/>
    <circle cx="216" cy="402" r="2.5"/><circle cx="237" cy="402" r="2.5"/><circle cx="258" cy="402" r="2.5"/><circle cx="279" cy="402" r="2.5"/><circle cx="300" cy="402" r="2.5"/>
    <circle cx="321" cy="402" r="2.5"/><circle cx="342" cy="402" r="2.5"/><circle cx="363" cy="402" r="2.5"/><circle cx="384" cy="402" r="2.5"/><circle cx="405" cy="402" r="2.5"/>
    <circle cx="426" cy="402" r="2.5"/><circle cx="447" cy="402" r="2.5"/><circle cx="468" cy="402" r="2.5"/><circle cx="489" cy="402" r="2.5"/><circle cx="510" cy="402" r="2.5"/>
    <circle cx="531" cy="402" r="2.5"/><circle cx="552" cy="402" r="2.5"/><circle cx="573" cy="402" r="2.5"/><circle cx="594" cy="402" r="2.5"/><circle cx="615" cy="402" r="2.5"/>
    <circle cx="636" cy="402" r="2.5"/><circle cx="657" cy="402" r="2.5"/><circle cx="678" cy="402" r="2.5"/><circle cx="699" cy="402" r="2.5"/><circle cx="720" cy="402" r="2.5"/>
  </g>

  <!-- p = 0.1: P = 0.9^k -->
  <polyline points="90,50.00 111,55.03 132,60.07 153,65.10 174,70.13 195,75.17 216,80.20 237,85.23 258,90.27 279,95.30 300,100.33 321,105.37 342,110.40 363,115.43 384,120.47 405,125.50 426,130.53 447,135.57 468,140.60 489,145.63 510,150.67 531,155.70 552,160.73 573,165.77 594,170.80 615,175.83 636,180.87 657,185.90 678,190.93 699,195.97 720,201.00" fill="none" stroke="#7e22ce" stroke-width="1.5"/>

  <!-- p = 0.5: P = 0.5^k, hasta salir de la escala en P = 0.001 (k ≈ 9.97) -->
  <polyline points="90,50.00 111,83.11 132,116.23 153,149.34 174,182.45 195,215.57 216,248.68 237,281.79 258,314.91 279,348.02 299.28,380" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- p = 0.2: P = 0.8^k (curva destacada) -->
  <polyline points="90,50 111,60.66 132,71.32 153,81.98 174,92.64 195,103.30 216,113.96 237,124.62 258,135.28 279,145.94 300,156.60 321,167.26 342,177.92 363,188.58 384,199.24 405,209.90 426,220.56 447,231.22 468,241.88 489,252.54 510,263.20 531,273.86 552,284.52 573,295.18 594,305.84 615,316.50 636,327.16 657,337.82 678,348.48 699,359.14 720,369.80" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <g fill="#b45309">
    <circle cx="90" cy="50" r="2.5"/><circle cx="111" cy="60.66" r="2.5"/><circle cx="132" cy="71.32" r="2.5"/><circle cx="153" cy="81.98" r="2.5"/><circle cx="174" cy="92.64" r="2.5"/>
    <circle cx="195" cy="103.30" r="2.5"/><circle cx="216" cy="113.96" r="2.5"/><circle cx="237" cy="124.62" r="2.5"/><circle cx="258" cy="135.28" r="2.5"/><circle cx="279" cy="145.94" r="2.5"/>
    <circle cx="300" cy="156.60" r="2.5"/><circle cx="321" cy="167.26" r="2.5"/><circle cx="342" cy="177.92" r="2.5"/><circle cx="363" cy="188.58" r="2.5"/><circle cx="384" cy="199.24" r="2.5"/>
    <circle cx="405" cy="209.90" r="2.5"/><circle cx="426" cy="220.56" r="2.5"/><circle cx="447" cy="231.22" r="2.5"/><circle cx="468" cy="241.88" r="2.5"/><circle cx="489" cy="252.54" r="2.5"/>
    <circle cx="510" cy="263.20" r="2.5"/><circle cx="531" cy="273.86" r="2.5"/><circle cx="552" cy="284.52" r="2.5"/><circle cx="573" cy="295.18" r="2.5"/><circle cx="594" cy="305.84" r="2.5"/>
    <circle cx="615" cy="316.50" r="2.5"/><circle cx="636" cy="327.16" r="2.5"/><circle cx="657" cy="337.82" r="2.5"/><circle cx="678" cy="348.48" r="2.5"/><circle cx="699" cy="359.14" r="2.5"/>
    <circle cx="720" cy="369.80" r="2.5"/>
  </g>

  <!-- Rótulos de los umbrales -->
  <rect x="200" y="195" width="166" height="15" fill="#ffffff"/>
  <text x="204" y="206" fill="#1d2433">α = 0.05: detección del 95 %</text>
  <rect x="250" y="273" width="162" height="15" fill="#ffffff"/>
  <text x="254" y="284" fill="#1d2433">α = 0.01: detección del 99 %</text>

  <!-- Puntos destacados sobre p = 0.2: k = 5 (esperanza 1/p), k = 14 y k = 21 -->
  <circle cx="195" cy="103.30" r="5" fill="none" stroke="#1d2433" stroke-width="1.5"/>
  <rect x="201" y="90" width="44" height="13" fill="#ffffff"/>
  <text x="204" y="100.5" font-size="11" fill="#1d2433">1/p = 5</text>
  <circle cx="384" cy="199.24" r="5" fill="none" stroke="#1d2433" stroke-width="1.5"/>
  <line x1="388" y1="195" x2="396" y2="177" stroke="#1d2433" stroke-width="1"/>
  <rect x="392" y="161" width="80" height="15" fill="#ffffff"/>
  <text x="396" y="172" fill="#1d2433">k = 14: 0.044</text>
  <circle cx="531" cy="273.86" r="5" fill="none" stroke="#1d2433" stroke-width="1.5"/>
  <line x1="535" y1="270" x2="542" y2="266" stroke="#1d2433" stroke-width="1"/>
  <rect x="541" y="252" width="96" height="15" fill="#ffffff"/>
  <text x="545" y="263" fill="#1d2433">k = 21: 0.0092</text>

  <!-- Nota -->
  <rect x="330" y="304" width="244" height="74" rx="8" fill="#fdf4e7" stroke="#b45309" stroke-width="1"/>
  <text x="340" y="321" fill="#1d2433">Con p = 0.2, la detección llega al 95 %</text>
  <text x="340" y="337" fill="#1d2433">en 14 partidas y al 99 % en 21; en</text>
  <text x="340" y="353" fill="#1d2433">promedio, ocurre en la 5.ª partida</text>
  <text x="340" y="369" fill="#1d2433">falsificada (1/p).</text>

  <!-- Leyenda -->
  <rect x="90" y="474" width="630" height="116" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <line x1="104" y1="494" x2="134" y2="494" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="119" cy="494" r="2.5" fill="#b45309"/>
  <text x="144" y="498" fill="#1d2433">p = 0.2: casual en nodo comunitario activo (tasa por defecto)</text>
  <line x1="104" y1="514" x2="134" y2="514" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="144" y="518" fill="#1d2433">p = 0.5: otra tasa que admite la configuración</text>
  <line x1="104" y1="534" x2="134" y2="534" stroke="#7e22ce" stroke-width="1.5"/>
  <text x="144" y="538" fill="#1d2433">p = 0.1: otra tasa que admite la configuración</text>
  <line x1="104" y1="554" x2="134" y2="554" stroke="#2f6f0e" stroke-width="2"/>
  <circle cx="119" cy="554" r="2.5" fill="#2f6f0e"/>
  <text x="144" y="558" fill="#1d2433">p = 1: clasificatoria, nodo en prueba o anfitrión desconocido</text>
  <line x1="104" y1="574" x2="134" y2="574" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="144" y="578" fill="#1d2433">p = 0: casual en nodo del proyecto (nunca se verifica)</text>
</svg>
