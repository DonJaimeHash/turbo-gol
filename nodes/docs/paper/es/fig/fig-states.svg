<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="800" viewBox="0 0 760 800" font-family="'Segoe UI', Arial, sans-serif" font-size="12">
  <title>Máquina de estados de un nodo</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker>
  </defs>

  <rect x="0" y="0" width="760" height="800" fill="#ffffff"/>

  <!-- Estados -->
  <rect x="190" y="20" width="160" height="44" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="270" y="47" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2433">no registrado</text>

  <rect x="190" y="124" width="160" height="46" rx="8" fill="#ffffff" stroke="#1d2433" stroke-width="1.5"/>
  <text x="270" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2433">pendiente</text>
  <text x="270" y="160" text-anchor="middle" fill="#6b7280">sin partidas</text>

  <rect x="190" y="236" width="160" height="60" rx="8" fill="#fdf4e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="270" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2433">prueba</text>
  <text x="270" y="273" text-anchor="middle" fill="#1d2433">solo casuales</text>
  <text x="270" y="289" text-anchor="middle" fill="#6b7280">todo se verifica (p = 1)</text>

  <rect x="190" y="420" width="160" height="60" rx="8" fill="#f2f5ee" stroke="#2f6f0e" stroke-width="1.5"/>
  <text x="270" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2433">activo</text>
  <text x="270" y="457" text-anchor="middle" fill="#1d2433">clasificatorias y casuales</text>
  <text x="270" y="473" text-anchor="middle" fill="#6b7280">casuales: p = 0.2</text>

  <rect x="560" y="236" width="160" height="244" rx="8" fill="#fdf4e7" stroke="#b45309" stroke-width="1.5"/>
  <text x="640" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2433">suspendido</text>
  <text x="640" y="348" text-anchor="middle" fill="#1d2433">pausa de 24 h</text>
  <text x="640" y="372" text-anchor="middle" fill="#6b7280">sin partidas nuevas;</text>
  <text x="640" y="390" text-anchor="middle" fill="#6b7280">cada falta vence</text>
  <text x="640" y="406" text-anchor="middle" fill="#6b7280">a los 7 días</text>

  <rect x="400" y="560" width="200" height="66" rx="8" fill="#fdf4e7" stroke="#b45309" stroke-width="2.5"/>
  <text x="500" y="582" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2433">suspendido</text>
  <text x="500" y="600" text-anchor="middle" fill="#1d2433">revisión manual</text>
  <text x="500" y="617" text-anchor="middle" fill="#6b7280">puntos del operador congelados</text>

  <rect x="400" y="670" width="200" height="52" rx="8" fill="#ffffff" stroke="#1d2433" stroke-width="1.5"/>
  <rect x="404" y="674" width="192" height="44" rx="6" fill="none" stroke="#1d2433" stroke-width="1"/>
  <text x="500" y="693" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2433">vetado</text>
  <text x="500" y="710" text-anchor="middle" fill="#6b7280">T11: inicio de sesión rechazado</text>

  <!-- T1: alta normal -->
  <line x1="270" y1="64" x2="270" y2="124" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="262" y="98" text-anchor="end" font-weight="700" fill="#1d2433">T1</text>
  <text x="282" y="90" fill="#1d2433">alta con código de un solo uso (válido 1 h)</text>
  <text x="282" y="106" fill="#6b7280">rol anfitrión</text>

  <!-- T2: alta solo verificador (de confianza) -->
  <path d="M190,42 H16 V466 H190" fill="none" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="103" y="35" text-anchor="middle" fill="#1d2433">alta solo verificador</text>
  <text x="103" y="58" text-anchor="middle" fill="#6b7280">(de confianza)</text>
  <text x="22" y="334" font-weight="700" fill="#1d2433">T2</text>

  <!-- T3: alcanzable (comunitario) -->
  <line x1="270" y1="170" x2="270" y2="236" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="262" y="208" text-anchor="end" font-weight="700" fill="#1d2433">T3</text>
  <text x="282" y="196" fill="#1d2433">nodo comunitario alcanzable</text>
  <text x="282" y="212" fill="#6b7280">(sonda HTTPS firmada o autoprueba WebRTC)</text>

  <!-- T4: alcanzable y de confianza -->
  <path d="M190,147 H106 V440 H190" fill="none" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="148" y="140" text-anchor="middle" fill="#1d2433">alcanzable y</text>
  <text x="148" y="163" text-anchor="middle" fill="#1d2433">de confianza</text>
  <text x="112" y="334" font-weight="700" fill="#1d2433">T4</text>

  <!-- T5/T6: promoción -->
  <line x1="270" y1="296" x2="270" y2="420" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="262" y="362" text-anchor="end" font-weight="700" fill="#1d2433">T5, T6</text>
  <text x="282" y="340" fill="#1d2433">T6: 20 partidas verificadas</text>
  <text x="282" y="355" fill="#1d2433">y ninguna falla de verificación</text>
  <text x="282" y="370" fill="#1d2433">en toda su vida</text>
  <text x="282" y="388" fill="#6b7280">(T5: alcanzable y de confianza)</text>

  <!-- T7/T8 con prueba -->
  <line x1="350" y1="252" x2="560" y2="252" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="355" y="247" font-weight="700" fill="#1d2433">T7</text>
  <text x="460" y="246" text-anchor="middle" fill="#1d2433">3 faltas en 7 días</text>
  <line x1="560" y1="280" x2="350" y2="280" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="365" y="275" font-weight="700" fill="#1d2433">T8</text>
  <text x="455" y="296" text-anchor="middle" fill="#1d2433">a las 24 h, si venía de prueba</text>
  <text x="455" y="310" text-anchor="middle" fill="#1d2433">o si es la 2.ª pausa en 30 días</text>

  <!-- T7/T8 con activo -->
  <line x1="350" y1="436" x2="560" y2="436" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="355" y="431" font-weight="700" fill="#1d2433">T7</text>
  <text x="460" y="430" text-anchor="middle" fill="#1d2433">3 faltas en 7 días</text>
  <line x1="560" y1="464" x2="350" y2="464" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="365" y="459" font-weight="700" fill="#1d2433">T8</text>
  <text x="455" y="480" text-anchor="middle" fill="#1d2433">a las 24 h, si venía de activo</text>
  <text x="455" y="494" text-anchor="middle" fill="#1d2433">y es la 1.ª pausa en 30 días</text>

  <!-- T9: verificación fallida, desde cualquier estado salvo vetado -->
  <circle cx="110" cy="593" r="4" fill="#1d2433"/>
  <line x1="114" y1="593" x2="400" y2="593" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="120" y="585" font-weight="700" fill="#1d2433">T9</text>
  <text x="263" y="585" text-anchor="middle" fill="#1d2433">verificación fallida de una partida suya</text>
  <text x="255" y="609" text-anchor="middle" fill="#6b7280">desde cualquier estado salvo vetado</text>
  <text x="255" y="623" text-anchor="middle" fill="#6b7280">(solo nodos comunitarios)</text>

  <!-- T10: decisión de mantenimiento -->
  <path d="M440,560 V530 H270 V480" fill="none" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="355" y="523" text-anchor="middle" fill="#1d2433"><tspan font-weight="700">T10</tspan>: activo o prueba</text>
  <line x1="500" y1="626" x2="500" y2="670" stroke="#1d2433" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="508" y="652" font-weight="700" fill="#1d2433">T10</text>

  <!-- Notas -->
  <g fill="#6b7280">
    <text x="16" y="752">T10 (mantenimiento) puede fijar prueba, activo, suspendido o vetado desde cualquier estado; nunca pendiente.</text>
    <text x="16" y="769">Pasar a prueba o activo borra las faltas; el contador de fallas de verificación no se borra nunca.</text>
    <text x="16" y="786">Los nodos de confianza no pasan por prueba, no se pausan por faltas y sus fallas de verificación solo generan una alerta.</text>
  </g>
</svg>
