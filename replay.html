<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#11151d" />
    <meta name="robots" content="noindex" />
    <title>Turbogol</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preload" href="/fonts/tg-display-v1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/style.css" />
    <!-- The viewer's own layout (src/replay/main.ts), on the game's tokens (src/ui/styles/tokens.css). -->
    <style>
      body { background: var(--surface-0); color: var(--text); font-family: var(--font-body); }
      .rp-hidden { display: none !important; }
      /* The match HUD shows the scorebug, the countdown and the goal banners only. */
      #hud .hud-boost, #hud .hud-cam, #hud .hud-controls, #hud .hud-fps, #hud .hud-ball-ind, #hud .hud-notch, #hud .hud-hint, #hud .hud-netwait, #hud .hud-bars { display: none !important; }
      #tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .rp-tag { position: absolute; left: 0; top: 0; padding: 2px 8px; border-radius: var(--r-pill); font: 600 var(--t-caption) / 1.3 var(--font-body); color: var(--text); background: var(--surface-0-90); border: 1px solid var(--edge); white-space: nowrap; transform: translate(-9999px, 0); will-change: transform; }
      .rp-tag.rp-blue { border-color: var(--blue); }
      .rp-tag.rp-red { border-color: var(--red); }
      button.rp-btn, a.rp-btn, select.rp-btn { appearance: none; display: inline-flex; align-items: center; gap: var(--sp-2); min-height: 36px; padding: 0 var(--sp-4); border-radius: var(--r-key); border: 1px solid var(--edge-hi); background: var(--surface-2); color: var(--text); font: 700 var(--t-small) / 1 var(--font-body); letter-spacing: 0.04em; text-decoration: none; cursor: pointer; }
      .rp-btn.rp-primary { background: var(--brand); border-color: var(--brand-hi); color: var(--brand-ink); }
      .rp-btn:focus-visible { outline: var(--focus-w) solid var(--focus); outline-offset: 2px; }
      /* The list */
      #list { position: absolute; inset: 0; overflow-y: auto; padding: calc(var(--safe-top) + var(--sp-6)) max(16px, var(--safe-right)) var(--sp-8) max(16px, var(--safe-left)); background: var(--mn-backdrop, var(--surface-0)); pointer-events: auto; }
      .rp-wrap { max-width: 960px; margin: 0 auto; }
      .rp-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; }
      .rp-h1 { margin: 0; font: var(--t-heading) / 1 var(--font-display); letter-spacing: var(--track-label, 0.06em); }
      .rp-intro { color: var(--text-2); font-size: var(--t-body); margin: var(--sp-3) 0 var(--sp-5); }
      .rp-note { color: var(--text-2); padding: var(--sp-6) 0; text-align: center; }
      .rp-rows { display: grid; gap: var(--sp-3); }
      .rp-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: var(--sp-4); padding: var(--sp-4); border-radius: var(--r-tile); background: var(--mn-card, var(--surface-1)); border: 1px solid var(--mn-edge, var(--edge)); }
      .rp-teams { display: grid; gap: var(--sp-1); min-width: 0; }
      .rp-team { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; font-weight: 600; }
      .rp-team span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rp-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
      .rp-dot.rp-blue { background: var(--blue); } .rp-dot.rp-red { background: var(--red); }
      .rp-meta { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-2); color: var(--text-3); font-size: var(--t-caption); }
      .rp-chip { padding: 1px 8px; border-radius: var(--r-pill); border: 1px solid var(--edge); color: var(--text-2); }
      .rp-chip.rp-ok { border-color: var(--ok); color: var(--ok); }
      .rp-chip.rp-warn { border-color: var(--warn); color: var(--warn); }
      .rp-score { font: var(--t-title) / 1 var(--font-display); white-space: nowrap; }
      .rp-score .rp-b { color: var(--blue-hi); } .rp-score .rp-r { color: var(--red-hi); }
      .rp-more { display: flex; justify-content: center; margin-top: var(--sp-5); }
      .rp-file { margin-top: var(--sp-6); color: var(--text-3); font-size: var(--t-caption); }
      .rp-file input { color: var(--text-2); }
      @media (max-width: 560px) { .rp-row { grid-template-columns: 1fr auto; } .rp-row .rp-btn { grid-column: 1 / -1; justify-content: center; } }
      /* The player's bar */
      #bar { position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: var(--sp-2); padding: var(--sp-3) max(16px, var(--safe-right)) calc(var(--sp-3) + var(--safe-bottom)) max(16px, var(--safe-left)); background: var(--surface-0-90); border-top: 1px solid var(--edge); pointer-events: auto; }
      .rp-line { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
      .rp-line .rp-grow { flex: 1; }
      .rp-time { font-variant-numeric: tabular-nums; color: var(--text-2); font-size: var(--t-small); white-space: nowrap; }
      .rp-track { position: relative; flex: 1; min-width: 160px; display: flex; align-items: center; }
      .rp-track input { width: 100%; accent-color: var(--brand); }
      .rp-marks { position: absolute; left: 8px; right: 8px; top: -6px; height: 6px; pointer-events: none; }
      .rp-mark { position: absolute; top: 0; width: 4px; height: 8px; margin-left: -2px; border-radius: 2px; }
      .rp-mark.rp-blue { background: var(--blue); } .rp-mark.rp-red { background: var(--red); }
      .rp-keys { color: var(--text-3); font-size: var(--t-caption); }
      #notice { position: absolute; left: 50%; top: calc(var(--safe-top) + 96px); transform: translateX(-50%); max-width: min(640px, calc(100% - 32px)); padding: var(--sp-3) var(--sp-4); border-radius: var(--r-panel); background: var(--surface-0-94); border: 1px solid var(--warn); color: var(--text); font-size: var(--t-small); text-align: center; pointer-events: auto; }
      #notice.rp-ok { border-color: var(--ok-glow, var(--ok)); color: var(--text-2); }
      #error { position: absolute; inset: 0; display: grid; place-content: center; gap: var(--sp-4); text-align: center; padding: 16px; pointer-events: auto; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="hud"></div>
      <div id="tags"></div>
      <div id="notice" class="rp-hidden"></div>
      <div id="bar" class="rp-hidden"></div>
      <div id="list" class="rp-hidden"></div>
      <div id="error" class="rp-hidden"></div>
      <div id="overlay" class="ld ld-on" aria-busy="true">
        <div class="ld-box">
          <div class="ld-logo" aria-hidden="true"><span class="ld-logo-a">TURBO</span><span class="ld-logo-b">GOL</span></div>
          <div class="ld-bar"><div class="ld-fill ld-creep"></div></div>
          <div class="ld-line"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/replay/main.ts"></script>
  </body>
</html>
