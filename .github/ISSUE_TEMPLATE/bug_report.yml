name: Bug report
description: Something does not work as expected
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems go to **Security → Report a vulnerability** instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the game and choose ...
        2. Press ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gameplay / physics
        - Bots
        - Training
        - Graphics / performance
        - Controls / settings
        - Menus / UI
        - Online (casual / P2P)
        - Online (server / ranked)
        - Accounts / lobbies
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser, OS and GPU
      placeholder: Chrome 140 on Windows 11, RTX 3060 (WebGPU)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output, screenshots or clips
      description: Press F12 → Console. For online issues the debug log `window.__game.p2p.log` helps a lot.
      render: text
