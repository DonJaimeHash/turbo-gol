version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
  # The community node program (its one runtime dependency, werift, runs on every host). Its
  # lockfile is a node release input: a merged update ships with the next node-v* release.
  - package-ecosystem: npm
    directory: /nodes
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
