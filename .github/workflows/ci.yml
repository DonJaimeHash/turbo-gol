# Continuous integration: the same checks CONTRIBUTING.md asks for before a pull request.
# The physics engine ships prebuilt (src/sim/wasm), so no C++ toolchain is needed here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The menus at the sizes that matter (780x360, 844x390, 960x540 as a TV, 1366x768 as a PC and as a
  # TV, 390x844) with the wide fallback text, in English and Spanish, with the hints of every input:
  # no bar of the shell overflows, nothing is cut (scripts/ui-fit.mjs, the Tablero plan §2.6; it
  # pins each size's device: this runner has no pointing device). Then Spanish in DejaVu Sans, a
  # Linux face wider than Arial. Information only until plan PR 6 makes it required.
  ui-fit:
    name: UI fit (information)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:client
        env:
          VITE_UI_FIT: '1'
      - run: node scripts/ui-fit.mjs
      - run: node scripts/ui-fit.mjs --face 'DejaVu Sans' --langs es
        if: ${{ !cancelled() }}

  server:
    name: Server (typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      # The server imports the shared client modules (protocol, sim, rating, bots): install the
      # root packages too so their types resolve.
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  nodes:
    name: Community nodes (typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nodes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            nodes/package-lock.json
      # The node runs the game's own code and wasm (root packages) and its typecheck uses the root
      # TypeScript; the release build takes esbuild from server/.
      - run: npm ci
        working-directory: .
      - run: npm ci
        working-directory: server
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The release as .github/workflows/node-release.yml builds it, unsigned, with the installers
      # filled from release-key.pub.
      - name: Release build (unsigned)
        run: |
          node scripts/build-node.mjs
          version=$(node -p "require('./package.json').version")
          test -f "dist/releases/$version/manifest.json"
          if grep -l __RELEASE_PUBLIC_KEY_ dist/releases/install.sh dist/releases/install-windows.ps1 dist/releases/install-desktop.sh; then
            echo "::error::an installer still has a release key placeholder"
            exit 1
          fi
